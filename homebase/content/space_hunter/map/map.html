<html>
    <head>

        <link rel="stylesheet" media="all" href="./map.css" type="text/css">
        
	    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="./map.js"></script>
    </head>
    <body>
    <div id="map"></div>    

    <script>
        
$( document ).ready( function() {
    namespace = '/refresh';
    var socket = io(namespace);

    socket.on('connect', function() {
        socket.emit('needs_refresh', {count: '10'});
        console.log("Connected");
    });
    socket.on('refresh', function(msg, cb) {
        console.log("Refreshing");
        console.log(msg);
        // updateDynamicMap("http://localhost:5002/get_data");
        console.log(msg["event"] === "jump_complete");
        moveSpaceshipTo(msg["data"][0] /* direction */, msg["data"][1] /* curX */, msg["data"][2] /* curY */);
    });
});

    </script>
    </body>
</html>
