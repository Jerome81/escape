<html>
    <head>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
//const mqtt = require('mqtt')
const url = 'ws://192.168.178.11:8083'

var language = "en";
var current_blueprint = "";
var product_complete;
var powered = false;
var pyrometer_cartridge = false;
var ring_cartridge = false;
var bubbles_cartridge = false;

// Create an MQTT client instance
const options = {
  // Clean session
  clean: true,
  connectTimeout: 4000,
  // Authentication
  clientId: 'replicator',
  username: 'outpost',
  password: 'CallingHome',
}

const client  = mqtt.connect(url, options)

client.on('connect', function () {

  console.log('Connected')
  // Subscribe to a topic
  client.subscribe('ToDevice/All', function (err) {
    if (!err) {
        console.log("Subscription Successful")
    }
  })
});


client.on('disconnect', function () {
  console.log('disonnected')
});


client.on('error', function () {
  console.log('error')
});

function addClickListener() {
  document.getElementById('main').addEventListener('click', function(event) {
    const x = event.clientX;
    const y = event.clientY;
    console.log(`Mouse clicked at X: ${x}, Y: ${y}`);
    
    img = document.getElementById("main");
    
    if (img.src.indexOf("_ready_") > -1 && (x > 297 && x < 495 && y > 334 && y < 375)) {
      img.src = current_blueprint + "_production_" + language + ".png";
      client.publish('ToDevice/All', JSON.stringify({ "event": 'Replicator ' + current_blueprint + ' production started' }))
    }
  });
}

function change_language() {
    img = document.getElementById("main");
    img.src = img.src.replace("_en", "_" + language);
    img.src = img.src.replace("_de", "_" + language);
}

function updateScreen() {
  img = document.getElementById("main");
  if (powered) {
    
    if (current_blueprint == "") {
      img.src = "insert_blueprint_" + language + ".png";
    } else {
      if (current_blueprint == "pyrometer" && pyrometer_cartridge) {
        img.src = current_blueprint + "_ready_" + language + ".png";
        return;
      }
      
      if (current_blueprint == "ring" && ring_cartridge) {
        img.src = current_blueprint + "_ready_" + language + ".png";
        return;
      }
      
      if (current_blueprint == "bubbles" && bubbles_cartridge) {
        img.src = current_blueprint + "_ready_" + language + ".png";
        return;
      }
      img.src = current_blueprint + "_missing_" + language + ".png";
    
    }
  } else {
    img = document.getElementById("main");
    img.src = "no_energy_" + language + ".png"
  }
}

// Receive messages
client.on('message', function (topic, message) {
  // message is Buffer
  msg = JSON.parse(message);
  console.log(msg);  
  if (msg["event"].indexOf("production started") > -1) {
    return;
  }
  if (msg["event"].indexOf(" produced") > -1) {
    img = document.getElementById("main");
    img.src = current_blueprint + "_done_" + language + ".png"
    return;
  }

  if (msg["event"] == "All devices powered") {
    powered = true;
  }
  if (msg["event"] == "Power down") {
    powered = false;
  }

  if ( msg["gameState"] == "RESET") {
    powered = false;
  }

  if (msg["event"] == "Pyrometer blueprint inserted") {
    current_blueprint = "pyrometer";
  }

  if (msg["event"] == "Ring blueprint inserted") {
    current_blueprint = "ring";
  }

  if (msg["event"] == "Bubbles blueprint inserted") {
    current_blueprint = "bubbles";
  }

  if (msg["event"] == "Apple blueprint inserted") {
    current_blueprint = "apple";
  }

  if (msg["event"] == "Lasergun blueprint inserted") {
    current_blueprint = "lasergun";
  }

  if (msg["event"] == "Hexapolym inserted") {
    pyrometer_cartridge = true;
    ring_cartridge = false;
    bubbles_cartridge = false;
  }

  if (msg["event"] == "Partynom inserted") {
    pyrometer_cartridge = false;
    ring_cartridge = false;
    bubbles_cartridge = true;
  }

  if (msg["event"] == "Amorata inserted") {
    pyrometer_cartridge = false;
    ring_cartridge = true;
    bubbles_cartridge = false;
  }

  if (msg["event"] == "No cartrdige inserted") {
    pyrometer_cartridge = false;
    ring_cartridge = false;
    bubbles_cartridge = false;
  }


  if (msg["language"] == "english") {
    language = "en";
    console.debug("English");
  }
  if (msg["language"] == "deutsch") {
    language = "de";
    console.debug("Deutsch");
  }
  if (msg["event"] == "Produce cartridge") {
    return;
  }
  updateScreen();
})
</script>

    </head>
    <body style="padding:0px;margin:0px;">
        <img id="main" src="no_energy_de.png" alt="Idle" border="0" style="padding:0px;margin:0px" draggable="false""/>
        
<script>
  addClickListener();
        </script>
    </body>
</html>
