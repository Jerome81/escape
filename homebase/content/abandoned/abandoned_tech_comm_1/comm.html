<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Image and Movie</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #000; /* Ensure black background */
        }
        @font-face {
            font-family: 'Welbut';
            src: url('Welbut__.ttf') format('truetype'); /* Chrome 4+, Firefox 3.5, Opera 10+, Safari 3—5 */
        }  

        #text-overlay {
            color: white;
            display: none;
            z-index: 10; /* Ensure the text is above the video */
        }

        #text-title {
            position:absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            font-size: 2em; 
            font-family: Welbut;
            color: lightblue;
            padding: 7px;
            background:darkblue;
            opacity: 0.7;
            border: 2px solid lightblue;
            border-radius: 7px;
            text-align: center;
            z-index: 10;
        }

        #text-message {
            align-items: center;
            justify-content: center;
            font-size: 2em; 
            font-family: Welbut;
            position: absolute;
            top: 25%;
            left: 10%;
            width: 80%;
            height: 60%;
            font-family: Welbut;
            color: lightblue;
            padding: 7px;
            background:darkblue;
            opacity: 0.7;
            border: 2px solid lightblue;
            border-radius: 7px;
            text-align: center;
            z-index: 10;
            white-space: pre-wrap; /* Preserve line breaks */
        }


        #movie-container {
            position: fixed; /* Fix the video to the viewport */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3; /* Place the video above the text */
            display: none; /* Initially hide the video */
        }

        #movie {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Scale the video to cover the entire viewport */
        }
    </style>
</head>
<body>  
    <div id="movie-container">
        <video id="movie" src="" muted="muted" controls loop></video>
    </div>
    <div id="text-overlay">
        <div id="text-title">NACHRICHT DER ISS RIDDLE</div>
        <div id="text-message"></div>
    </div>


    <script>
        var _just_shown = false;
        window.onload = function() {
            console.log(_just_shown);
            const movieContainer = document.getElementById('movie-container');
            const textContainer = document.getElementById('text-container');
            const movie = document.getElementById('movie');
            const device_id = 'tech_comm_1';
            const url = 'ws://192.168.5.11:8083'
            var last_display_tag_value = "none";
            var language = "de"
            var overheat_message_counter = 0;
            var last_overheat_message = null;
            
            // Create an MQTT client instance
            const options = {
                // Clean session
                clean: true,
                connectTimeout: 4000,
                // Authentication
                clientId: device_id, 
                username: 'outpost',
                password: 'CallingHome',
            }
            
            function showMovieAndText(movie, text) {
                showText(text);
                playMovie(movie);
                movie.loop = true;
            }   

            function playMovie(name) {
                const movieContainer = document.getElementById('movie-container');
                const movie = document.getElementById('movie');
                movie.src = name;
                movieContainer.style.display = 'block'; // Show the video container
                movie.play(); // Start playing the video
                movie.controls = false; //remove controls  
            }

            function showMovie(name) {
                const textContainer = document.getElementById('text-overlay');
                last_display_tag_value = textContainer.style.display;
                textContainer.style.display = "none";
                playMovie(name);
                movie.loop = false;
            }
            
            function showText(text) {  
                const textContainer = document.getElementById('text-overlay');
                const textMessage = document.getElementById('text-message');
                const textTitle = document.getElementById("text-title");
                textContainer.style.display = "block";
                textMessage.style.display = "flex";
                textTitle.style.display = "block";
                textMessage.innerText = text;
                
                setTimeout(() => {
                    const textContainer = document.getElementById('text-overlay');
                    const textMessage = document.getElementById('text-message');
                    const textTitle = document.getElementById("text-title");
                    textContainer.style.display = "none";
                    textMessage.style.display = "none";
                    textTitle.style.display = "none";
                }, 40000);
            }

            const client  = mqtt.connect(url, options)
            client.on('connect', function () {
                console.log('Connected')
                // Subscribe to a topic
                client.subscribe('ToDevice/All', function (err) {
                    if (!err) {
                        console.log("Subscription Successful")
                    }
                });
                client.subscribe('ToDevice/Comms', function (err) {
                    if (!err) {
                        console.log("Subscription Successful")
                    }
                });
                client.subscribe('ToDevice/' + device_id, function (err) {
                    if (!err) {
                        console.log("Subscription Successful")
                    }
                });
                showMovie("background.mp4");
            });

            
            // Receive messages
            client.on('message', function (topic, message) {
                // message is Buffer
                msg = JSON.parse(message);
                console.log(msg);
                if (msg["event"] == "Overheat solved") {
                    showMovie("overheat_solved_" + language + ".mp4");
                }
                if (msg["event"] == "Ripplis hint") {
                    showMovie("ripplis_hint_" + language + ".mp4");
                }

                if (msg["event"] == "Intruder alert") {
                    showMovie("intruder_detected_" + language + ".mp4");
                }

                if (msg["event"] == "Communication channel established") {
                    showMovie("saved_by_alien_" + language + ".mp4");
                }

                if (msg["display"] == "Cockpit overheated") {
                    if (last_overheat_message == null || (new Date().getTime() - last_overheat_message.getTime()) / 1000 > 7) {
                        last_overheat_message = new Date();
                        overheat_message_counter++;
                        if (overheat_message_counter > 4) {
                            showMovie("cockpit_overheated_annoyed_" + language + ".mp4");
                        } else {
                            showMovie("cockpit_overheated_" + language + ".mp4");
                        }
                    }
                    return;
                }

                if (msg["event"] == "ISS Riddle intervention") {
                    showMovie("iss_riddle_help_" + language + ".mp4");
                }

                if (msg["event"] == "AI Warning") {
                    showMovie("ai_warning_" + language + ".mp4");
                }
                if (msg["event"] == "Dock door unlocked") {
                    showMovie("dock_door_unlocked_" + language + ".mp4");
                }

                if (msg["movie"] != null) {
                    showMovie(msg["movie"] + language + ".mp4");
                }

                if (msg["display"] != null) {
                    // Cockpit overheated is handled earlier.
                    // This is for gamemaster hints.
                    showMovieAndText("background.mp4", msg["display"]);
                }

                if (msg["language"] == "english") {
                    language = "en";
                    textTitle = document.getElementById("text-title");
                    textTitle.innerText = "Message from the ISS Riddle";
                }
                if (msg["language"] == "deutsch") {
                    language = "de";
                    textTitle = document.getElementById("text-title");
                    textTitle.innerText = "Nachricht der ISS Riddle";
                }
                //client.end()
                }
            );
            movie.onended = function() {    
                console.info("Movie ended");
                movie.src = "background.mp4";
                movie.loop = true;
                const textContainer = document.getElementById('text-overlay');
                textContainer.style.display = last_display_tag_value;
                    

                movie.play();
            };
        };
    </script>
</body>
</html>
