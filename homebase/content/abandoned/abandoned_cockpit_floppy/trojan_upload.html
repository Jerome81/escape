<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL TROYANO</title>
    <link rel="stylesheet" href="virus_upload.css">    
    <script src="mqtt-min.js"></script>
</head>
<body>
    <div class="container">
        <h1>⚠️UPLOADING EL TROYANO ⚠️</h1>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <p class="status-text">TIME: <span id="timeRemaining">Calculating</span></p>
        <p id="claim" class="status-text warning-glow">I AM THE UNIVERSE</p>
    </div>
    <script>
const url = 'ws://192.168.5.11:8083'

const params = new URLSearchParams(window.location.search);
var language = params.get("lang");
change_language_to(language)

function change_language_to(lang) {
    if (lang == "de") {
        document.querySelector("h1").innerText = "⚠️ EL TROYANO - UPLOAD ⚠️";
        document.getElementById("claim").innerText = "ICH BIN DAS UNIVERSUM";
    }
    if (lang == "en") {
        document.querySelector("h1").innerText = "⚠️ EL TROYANO - UPLOADING ⚠️";
        document.getElementById("claim").innerText = "I AM THE UNIVERSE";
    }
}

// Create an MQTT client instance
const options = {
    // Clean session
    clean: true,
    connectTimeout: 4000,
    // Authentication
    clientId: 'cockpit_floppy4',
    username: 'outpost',
    password: 'CallingHome',
}

const client  = mqtt.connect(url, options)

client.on('connect', function () {

console.log('Connected')
// Subscribe to a topic
    client.subscribe('ToDevice/All', function (err) {
        if (!err) {
            console.log("Subscription Successful")
        }
    });
});


client.on('disconnect', function () {
    console.log('disonnected')
});


client.on('error', function () {
    console.log('error')
});

function sendMessageToAll(message) {
    client.publish('ToDevice/All', JSON.stringify({ "event": message }))
}  

document.addEventListener('DOMContentLoaded', () => {
    const progressBar = document.getElementById('progressBar');
    const timeRemainingDisplay = document.getElementById('timeRemaining');
    const DURATION = 500; /* 5 seconds because update is every 100ms */
    const UPDATE_INTERVAL_MS = 10; // Update every 10 ms
    let timeElapsed = 0;

    // Function to update the progress bar and timer
    function updateProgress() {
        
	if (timeElapsed > DURATION) {
            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            // sleep for 2 seconds and then redirect
	        sendMessageToAll("Virus upload started");
                setTimeout(function() { 
                window.location.href = "initiate_core_removal.html?lang=" + language;
            }, 4000);
            return;
        }

        // 1. Update Progress Bar
        const percentage = (timeElapsed / DURATION) * 100;

        progressBar.style.width = percentage + '%';

       // 2. Update Countdown Timer
        const secondsRemaining = (DURATION - timeElapsed) / 100;
        const minutes = Math.floor(secondsRemaining / 60);
        const seconds = secondsRemaining % 60;
        
        // Format to MM:SS
        formattedTime = 
            String(seconds).padStart(1, '0');
 
        if (formattedTime.length == 3) { 
            formattedTime = formattedTime + "0";
        }
        if (formattedTime.length == 1) { 
            formattedTime = formattedTime + ".00";
        }
                
        timeRemainingDisplay.textContent = formattedTime;
        timeElapsed++;
	
    }

    // Start the progress update interval
    const progressInterval = setInterval(updateProgress, UPDATE_INTERVAL_MS);

    // Run once immediately to set the initial state (10:00 and 0%)
    updateProgress();
});
    </script>

</body>
</html>
