<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human identification protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="tailwind.css"></script>
    <style>
        /* Custom styles for the game */
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Improves touch responsiveness on mobile */
        }

        h1, h2 {
            font-family: 'Orbitron', sans-serif;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            perspective: 1000px; /* Gives the 3D effect for the flip */
            margin-top: 50px;
        }

        .card {
            background-color: transparent;
            width: 140px;
            aspect-ratio: 1 / 1; /* Makes the cards perfectly square and responsive */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back of the element when flipped */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background-color: #e5e7eb; /* Light gray */
            color: #1f2937;
            transform: rotateY(180deg); /* Start with the front face hidden */
            font-size: clamp(2rem, 10vw, 4rem); /* Responsive font size */
            border: 2px solid #9ca3af;
        }

        .card-back {
            background-color: #1e3a8a; /* Dark blue */
            border: 2px solid #3b82f6; /* Lighter blue border */
        }
        
        .card-back-icon {
            width: 70%;
            height: 70%;
            stroke: #93c5fd; /* Light blue for the icon lines */
            stroke-width: 2;
            fill: none;
        }
        
        .card.matched {
            transform: rotateY(180deg); /* Keep card flipped */
            cursor: default; /* Show it's not clickable anymore */
            border-width: thick;
            border-color: lightgreen;
        }
    </style>
</head>
<body class="bg-gray-900 text-slate-300 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-6">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-100 tracking-widest uppercase">Persönlicher Override Mechanismus Aktivieren</h1>
    </div>

    <!-- Game Board -->
    <main class="w-full max-w-md md:max-w-lg lg:max-w-xl mx-auto">
        <div id="game-board" class="game-board">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </main>

    <script>
        const url = 'ws://192.168.5.11:8083'

        var language = "de";


        // Create an MQTT client instance
        const options = {
            // Clean session
            clean: true,
            connectTimeout: 4000,
            // Authentication
            clientId: 'cockpit_floppy2',
            username: 'outpost',
            password: 'CallingHome',
        }

        const client  = mqtt.connect(url, options)

        client.on('connect', function () {

        console.log('Connected')
        // Subscribe to a topic
            client.subscribe('ToDevice/All', function (err) {
                if (!err) {
                    console.log("Subscription Successful")
                }
            });
            client.subscribe('ToDevice/console_screen', function (err) {
                if (!err) {
                    console.log("Subscription Successful");
                    setTimeout(function() {
                        client.publish('FromDevice/' + options["clientId"], "Connected");
                        console.log("Published to: FromDevice/" + options["clientId"]);
                    }, 10000);
                    
                }
            });
        });


        client.on('disconnect', function () {
            console.log('disonnected')
        });


        client.on('error', function () {
            console.log('error')
        });

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const gameBoard = document.getElementById('game-board');
            const questionBoard = document.getElementById('question-board');

            function sendMessageToMainScreen(message) {
                client.publish('ToDevice/console_screen', JSON.stringify({ "guess": message }))
            }

            /**
             * Creates the game board and populates it with cards.
             */
            function createBoard() {
                // Receive messages
                client.on('message', function (topic, message) {
                    // message is Buffer
                    // console.log(message);
                    msg = JSON.parse(message);
                    console.log(msg);
                    if (msg["event"] != null) {
                        if (msg["event"] == "Memory solved") {
                            window.location.href = "empty_de.png";
                        }
                    }

                });
                // Reset game state
                moves = 0;
                matchedPairs = 0;
                lockBoard = false;
                firstCard = null;
                secondCard = null;
                
                gameBoard.innerHTML = '';

                // Create card elements and append to the board
                for (i = 1; i < 9; i++) {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card');
                    //cardElement.classList.add('flipped');
                    cardElement.id = "card" + i;
                    cardElement.dataset.emoji = i;

                    cardElement.innerHTML = `
                        <div class="card-face card-front">${i}</div>
                        <div class="card-face card-back"><img src="mem_back.png"></div>
                    `;

                    cardElement.addEventListener('click', handleCardClick);
                    gameBoard.appendChild(cardElement);
                };
                resetBoard();
            }

     
            /**
             * Handles the logic when a card is clicked.
             */
            async function handleCardClick() {
                if (lockBoard || this === firstCard || this.classList.contains('matched')) return;
                card = this.dataset.emoji;
                sendMessageToMainScreen(card);
                console.log("Clicked: " + card);
                lockBoard = true;
                hideCards();
                
                await new Promise(r => setTimeout(r, 1500));
                revealCards();
                lockBoard = false;

            }
     
            /**
             * Resets the board state after a turn.
             */
            function resetBoard() {
                [firstCard, secondCard] = [null, null];
                lockBoard = false;
                revealCards();
            }
            
            async function revealCards() {
                cards = gameBoard.getElementsByClassName("card");
                for (var i = 0; i < cards.length; i++) {
                    cards[i].classList.add("flipped");
                    await new Promise(r => setTimeout(r, 100));
                }
            }

            async function hideCards() {
                cards = gameBoard.getElementsByClassName("card");
                for (var i = 0; i < cards.length; i++) {
                    cards[i].classList.remove("flipped");
                    await new Promise(r => setTimeout(r, 100));
                }
        
            }
            

            // --- Initial Game Start ---
            createBoard();
        });

    </script>

</body>
</html>
