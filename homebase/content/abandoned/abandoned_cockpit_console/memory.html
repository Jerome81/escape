<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human identification protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="mqtt-min.js"></script>
    <script src="tailwind.css"></script>
    <style>
        /* Custom styles for the game */
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Improves touch responsiveness on mobile */
        }

        h1, h2 {
            font-family: 'Orbitron', sans-serif;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            perspective: 1000px; /* Gives the 3D effect for the flip */
            margin-top: 50px;
        }

        .question-board {
            width: 140px;
            margin: 0 auto;    
            font-family: 'Orbitron', sans-serif;
            perspective: 1000px; /* Gives the 3D effect for the flip */
        }

        .question-section {
            width:100%;
            display: grid;
            justify-content: center;
        }

        .question-statement {
            font-family: 'Orbitron', sans-serif;
            font-size: large;
            width: 100%;
            padding-bottom: 10px;
        }

        .card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 1 / 1; /* Makes the cards perfectly square and responsive */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back of the element when flipped */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background-color: #e5e7eb; /* Light gray */
            color: #1f2937;
            transform: rotateY(180deg); /* Start with the front face hidden */
            font-size: clamp(2rem, 10vw, 4rem); /* Responsive font size */
            border: 2px solid #9ca3af;
        }

        .card-back {
            background-color: #1e3a8a; /* Dark blue */
            border: 2px solid #3b82f6; /* Lighter blue border */
        }
        
        .card-back-icon {
            width: 70%;
            height: 70%;
            stroke: #93c5fd; /* Light blue for the icon lines */
            stroke-width: 2;
            fill: none;
        }
        
        .card.matched {
            transform: rotateY(180deg); /* Keep card flipped */
            cursor: default; /* Show it's not clickable anymore */
            border-width: thick;
            border-color: lightgreen;
        }
    </style>
</head>
<body class="bg-gray-900 text-slate-300 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-6">
        <h1 id="title" class="text-4xl md:text-5xl font-bold text-slate-100 tracking-widest uppercase">Core Removal</h1>
        <p id="identification" class="text-slate-400 mt-2">Identifikation</p>
    </div>

    <!-- Game Board -->
    <main class="w-full max-w-md md:max-w-lg lg:max-w-xl mx-auto">
        <div id="question-section" class="question-section">
            <div id="question-statement" class="question-statement">Wo haben wir das gesehen:</div>
            <div id="question-board" class="question-board">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>
        
        <div id="game-board" class="game-board">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </main>

    <script>
const url = 'ws://192.168.5.11:8083'

const params = new URLSearchParams(window.location.search);

var language = params.get("lang");
change_language_to(language)

function change_language_to(lang) {
    if (lang == "de") {
        document.getElementById("title").innerText = "Core Removal";
        document.getElementById("identification").innerText = "Identifikation der ISS Hofmann Crew";
        document.getElementById("question-statement").innerText = "Wo haben wir das gesehen:";
    }
    if (lang == "en") {
        document.getElementById("title").innerText = "Core Removal";
        document.getElementById("identification").innerText = "Identification of the ISS Hofmann Crew";
        document.getElementById("question-statement").innerText = "Where have we seen this:";
    }
}

// Create an MQTT client instance
const options = {
    // Clean session
    clean: true,
    connectTimeout: 4000,
    // Authentication
    clientId: 'console_screen2',
    username: 'outpost',
    password: 'CallingHome',
}

const client  = mqtt.connect(url, options)

client.on('connect', function () {

console.log('Connected')
// Subscribe to a topic
    client.subscribe('ToDevice/All', function (err) {
        if (!err) {
            console.log("Subscription Successful")
        }
    });
    client.subscribe('ToDevice/console_screen', function (err) {
        if (!err) {
            console.log("Subscription Successful");
            setTimeout(function() {
                client.publish('FromDevice/' + options["clientId"], "Connected");
                console.log("Published to: FromDevice/" + options["clientId"]);
            }, 10000);
            
        }
    });
});


client.on('disconnect', function () {
    console.log('disonnected')
});


client.on('error', function () {
    console.log('error')
});

document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const gameBoard = document.getElementById('game-board');
    const questionBoard = document.getElementById('question-board');

    // --- Game Data ---
    let questionCards = ['001a.png', 
        '002a.png', 
        '003a.png', 
        '004a.png', 
        '005a.png', 
        '006a.png', 
        '007a.png', 
        '008a.png'
    ];

    // --- Game Data ---
    const allCards = [
        '001b.png',   
        '002b.png',
        '003b.png', 
        '004b.png', 
        '005b.png', 
        '006b.png', 
        '007b.png', 
        '008b.png'];



    // --- Game State Variables ---
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matchedPairs = 0;
    
    function sendMessageToAll(message) {
        client.publish('ToDevice/All', JSON.stringify({ "event": message }))
    }

    /**
     * Creates the game board and populates it with cards.
     */
    function createBoard() {
        // Receive messages
        client.on('message', function (topic, message) {
            // message is Buffer
            // console.log(message);
            msg = JSON.parse(message);
            console.log(msg);

            if (msg["event"] != null) {
                if (msg["event"] == "Memory solved") {
                    window.location.href = "todo.html?lang=" + language + "&check_task=1";
                }
            }

            if (msg["guess"] != null) {
                console.log("00" + msg["guess"] + "b.png");
                card = document.getElementById("card00" + msg["guess"] + "b.png");
                console.log(card);
                handleCardClick(card);
            }

        });
        // Reset game state
        moves = 0;
        matchedPairs = 0;
        lockBoard = false;
        firstCard = null;
        secondCard = null;
        
        gameBoard.innerHTML = '';

        // Create card elements and append to the board
        allCards.forEach(card => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.id = "card" + card;
            cardElement.dataset.card = card;

            cardElement.innerHTML = `
                <div class="card-face card-front"><img src="${card}"/></div>
                <div class="card-face card-back"><img src="mem_back.png"></div>
            `;

            cardElement.addEventListener('click', handleCardClick);
            gameBoard.appendChild(cardElement);
        });
        resetBoard();
    }

    async function newQuestionCard() {
            questionBoard.innerHTML = '';
        card = questionCards[Math.floor(Math.random() * questionCards.length)];
        const cardElement = document.createElement('div');
        cardElement.classList.add('card');
        cardElement.dataset.card = card;

        cardElement.innerHTML = `
            <div class="card-face card-front"><img src="${card}"/></div>
            <div class="card-face card-back"><img src="mem_back.png"></div>
        `;
        firstCard = cardElement;
        questionBoard.appendChild(cardElement);

        await new Promise(r => setTimeout(r, 1000));
        cardElement.classList.add('flipped');
    }

    /**
     * Handles the logic when a card is clicked.
     */
    function handleCardClick() {
        if (lockBoard || this === firstCard || this.classList.contains('matched')) return;

        this.classList.add('flipped');

        if (!firstCard) {
            firstCard = this;
            return;
        }

        secondCard = this;
        moves++;
        lockBoard = true;

        checkForMatch();
    }
    function handleCardClick(cardElement) {
        if (lockBoard || cardElement === firstCard || cardElement.classList.contains('matched')) return;

        cardElement.classList.add('flipped');

        if (!firstCard) {
            firstCard = cardElement;
            return;
        }

        secondCard = cardElement;
        moves++;
        lockBoard = true;

        checkForMatch();
    }

    /**
     * Checks if the two flipped cards are a match.
     */
    async function checkForMatch() {
        const isMatch = firstCard.dataset.card.substring(0, 3) === secondCard.dataset.card.substring(0, 3);
        if (isMatch) {
            handleMatch();
        } else {
            hideCards();
            await new Promise(r => setTimeout(r, 1500));
            resetBoard();
        }  
    }
    
    /**
     * Handles the logic for a successful match.
     */
    async function handleMatch() {
        secondCard.classList.add('matched');
        await new Promise(r => setTimeout(r, 200));
        firstCard.classList.remove('flipped');
        await new Promise(r => setTimeout(r, 500));
        index = questionCards.indexOf(firstCard.dataset.card);
        if (index > -1) {
            questionCards.splice(index, 1);
            console.log(questionCards);
        }
        matchedPairs++;
        
        if (matchedPairs === allCards.length) {
            puzzleSolved();
        }
        
        resetBoard();
    }

    function puzzleSolved() {
        sendMessageToAll("Memory solved");
        sendMessageToAll("Activate orbital");
    }


    /**
     * Resets the board state after a turn.
     */
    function resetBoard() {
        [firstCard, secondCard] = [null, null];
        lockBoard = false;
        newQuestionCard();
        revealCards();
    }
    
    async function revealCards() {
        cards = gameBoard.getElementsByClassName("card");
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.add("flipped");
            await new Promise(r => setTimeout(r, 100));
        }
        cards = questionBoard.getElementsByClassName("card");
        cards[0].classList.add("flipped");
        await new Promise(r => setTimeout(r, 100));
        
    }

    async function hideCards() {
        cards = gameBoard.getElementsByClassName("card");
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove("flipped");
            await new Promise(r => setTimeout(r, 100));
        }
        cards = questionBoard.getElementsByClassName("card");
        cards[0].classList.remove("flipped");
        await new Promise(r => setTimeout(r, 100));
    }
    
    // --- Initial Game Start ---
    createBoard();
});

    </script>

</body>
</html>
