<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="mqtt-min.js"></script>
    <title>Ship's Task Log</title>
    <style>
        /* --- Global Styles --- */
        @font-face {
            font-family: "SpaceFrigate";
            src: url("spacefr.ttf") format("truetype");
        }

        body {
            background-color: #000000; /* Pure black background */
            color: rgb(0, 170, 255); /* Bright, blueish font */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Todo Container --- */
        .todo-container {
            position: absolute;
            font-family: 'Roboto', sans-serif;
            left: 130px;            
            font-size: larger;
            width: 700px;
            padding: 25px;
        }

        #core {
            top: 570px;
        }

        #selfdestruct {
            top: 1450px;
        }

        /* --- Header --- */
        h1 {
            color: #0CF; /* Lighter, brighter blue for header */
            text-align: center;
            font-family: 'SpaceFrigate';
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            border-bottom: 1px dashed #08F;
            padding-bottom: 15px;
        }

        /* --- Input Area --- */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #task-input {
            flex-grow: 1; /* Input takes most of the space */
            background-color: #000;
            border: 1px solid #05A;

            color: #0AF;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
        }

        #task-input::placeholder {
            color: #05A;
            opacity: 0.7;
        }

        #add-task-btn {
            background-color: #05A;
            border: 1px solid #08F;
            color: #FFF;
            padding: 0 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        #add-task-btn:hover {
            background-color: #08F;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.7);
        }

        /* --- Task List --- */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-list li {
            display: flex;
            color: white;
            align-items: center;
            padding: 12px 5px;
            transition: background-color 0.3s;
        }

        .task-list li:last-child {
            border-bottom: none;
        }

        .task-list li label {
            flex-grow: 1;
            margin-left: 40px;
            cursor: pointer;
            font-size: 1.7em;
        }

        /* --- Custom Checkbox (basic) --- */
        .task-list input[type="checkbox"] {
            /* Basic styling for the checkbox */
            appearance: none;
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            background-color: #ED0B4F;
            border: 2px solid #ED0B4F;
            cursor: pointer;
            position: relative;
        }

        .task-list input[type="checkbox"]:checked {
            background-color: #06E322;
            border: 2px solid  #06E322;
        }

        /* Style for completed tasks */
        .task-list input[type="checkbox"]:checked + label {
            text-decoration: line-through;
        }

    </style>
</head>
<body>

    <img id="main" src="todo_no_destruct_de.png" alt="Idle" border="0" style="padding:0px;margin:0px" draggable="false""/>
    <div id="core" class="todo-container">

        <ul class="task-list">
            <li>
                <input type="checkbox" id="task1">
                <label for="task1">Prozess starten</label>
            </li>

            <li>
                <input type="checkbox" id="task2">
                <label for="task2">Identifikation</label>
            </li>

            <li>
                <input type="checkbox" id="task3">
                <label for="task3">Zugriffscheck</label>
            </li>

            <li>
                <input type="checkbox" id="task4">
                <label for="task4">Wartungstür Core-Tower öffnen</label>
            </li>
            
            <li>
                <input type="checkbox" id="task5">
                <label for="task5">Core entfernen</label>
            </li>
        </ul>
    </div>

    <div id="selfdestruct" class="todo-container" style="display: none;">


        <ul class="task-list">
            <li>
                <input type="checkbox" id="task6">
                <label for="task6">Sicherheitsschalter deaktivieren</label>
            </li>

            <li>
                <input type="checkbox" id="task7">
                <label for="task7">Selbstzerstörung durch Drücken <br/>des roten Knopfes auslösen</label>
            </li>
        </ul>
    </div>

    <script>
const url = 'ws://192.168.5.11:8083'
const params = new URLSearchParams(window.location.search);

var language = params.get("lang");
change_language_to(language)

function change_language_to(lang) {
    if (lang == "de") {
        document.querySelector("label[for='task1']").innerText = "Prozess starten";
        document.querySelector("label[for='task2']").innerText = "Identifikation";
        document.querySelector("label[for='task3']").innerText = "Zugriffscheck";
        document.querySelector("label[for='task4']").innerText = "Wartungstür Core-Tower öffnen";
        document.querySelector("label[for='task5']").innerText = "Core entfernen";
        
        document.querySelector("label[for='task6']").innerText = "Sicherheitsschalter deaktivieren";
        document.querySelector("label[for='task7']").innerHTML = "Selbstzerstörung durch Drücken <br/>des roten Knopfes auslösen";
    }
    if (lang == "en") {
        document.querySelector("label[for='task1']").innerText = "Initiate process";
        document.querySelector("label[for='task2']").innerText = "Identification";
        document.querySelector("label[for='task3']").innerText = "Access check";
        document.querySelector("label[for='task4']").innerText = "Open core tower maintenance door";
        document.querySelector("label[for='task5']").innerText = "Remove core";

        document.querySelector("label[for='task6']").innerText = "Deactivate safety switch";
        document.querySelector("label[for='task7']").innerHTML = "Immediately trigger self-destruction <br/>by pressing the red button";
    }
}

if (params.get("check_task") == "1") {
    task = document.getElementById("task1");
    task.checked = true;
    task = document.getElementById("task2");
    task.checked = true;
}

// Create an MQTT client instance
const options = {
    // Clean session
    clean: true,
    connectTimeout: 4000,
    // Authentication
    clientId: 'console_screen2',
    username: 'outpost',
    password: 'CallingHome',
}

const client  = mqtt.connect(url, options)

client.on('connect', function () {

console.log('Connected')
// Subscribe to a topic
    client.subscribe('ToDevice/All', function (err) {
        if (!err) {
            console.log("Subscription Successful")
        }
    });
    client.subscribe('ToDevice/console_screen', function (err) {
        if (!err) {
            console.log("Subscription Successful");
            setTimeout(function() {
                client.publish('FromDevice/' + options["clientId"], "Connected");
                console.log("Published to: FromDevice/" + options["clientId"]);
            }, 10000);
            
        }
    });
});


client.on('disconnect', function () {
    console.log('disonnected')
});


client.on('error', function () {
    console.log('error')
});

client.on('message', function (topic, message) {
    // message is Buffer
    // console.log(message);
    msg = JSON.parse(message);
    console.log(msg);

    if (msg["event"] != null) {
        if (msg["event"] == "Initiate core removal process") {
            task = document.getElementById("task1");
            task.checked = true;
            // sleep for 2 seconds
            setTimeout(function() {
                window.location.href = "memory.html?lang=" + language;
            }, 2000);
        }
        if (msg["event"] == "Access granted") {
            task = document.getElementById("task3");
            task.checked = true;
        }
        if (msg["event"] == "Core access granted") {
            task = document.getElementById("task4");
            task.checked = true;
        }
        if (msg["event"] == "Core removed") {
            task = document.getElementById("task5");
            task.checked = true;
        }

        if (msg["event"] == "Self destruction activated") {
            img = document.getElementById("main");
            img.src = "todo_destruct_" + language + ".png";
            div = document.getElementById("selfdestruct");
            div.setAttribute("style", "display: block;");
            
        }

        if (msg["event"] == "Self destruction safety deactivated") {
            task = document.getElementById("task6");
            task.checked = true;
        }

        if (msg["event"] == "Self destruction safety activated") {
            task = document.getElementById("task6");
            task.checked = false;
        }
    }

});
    </script>
</body>
</html>
